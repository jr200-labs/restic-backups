# Copy this file and pass it with --config. Add --sops after encrypting it.
# Do not commit real credentials or an unencrypted copy.

# Storage backends. S3 credentials belong to their storage entry; local storage
# needs only an absolute path to an existing mounted directory.
storage:
    - id: backblaze-b2
      # Optional user note; does not affect backup behavior.
      description: Backblaze B2 S3-compatible storage.
      type: s3
      endpoint: CHANGE_ME # For example: https://s3.us-west-004.backblazeb2.com
      region: CHANGE_ME
      credentials:
          access-key-id: CHANGE_ME
          secret-access-key: CHANGE_ME

    - id: aws-s3
      description: AWS S3 storage.
      type: s3
      endpoint: https://s3.us-east-1.amazonaws.com
      region: us-east-1
      credentials:
          access-key-id: CHANGE_ME
          secret-access-key: CHANGE_ME

    - id: external-disk
      description: Mounted external backup disk.
      type: local
      # Must be absolute. Commands fail if this directory is not mounted.
      path: /Volumes/CHANGE_ME

# Encrypted restic repositories within the storage backends above.
restic-repositories:
    - id: personal-b2
      description: Personal restic repository on Backblaze B2.
      storage-id: backblaze-b2
      # Set false to ignore this repository; disabled entries may retain CHANGE_ME.
      enabled: true
      bucket: CHANGE_ME
      # Object-key prefix for the restic repository inside the bucket.
      key_prefix: restic
      # Optional restic cache; relative paths are resolved beside this file.
      # cache-dir: .restic-cache/personal-b2
      # Restic repository encryption password, not the storage password.
      password: CHANGE_ME

    - id: archive-aws
      description: AWS S3 Glacier restic repository.
      storage-id: aws-s3
      enabled: false
      bucket: CHANGE_ME
      key_prefix: CHANGE_ME
      password: CHANGE_ME
      # Optional AWS archive policy. Omit for the provider's default storage.
      archive:
          storage-class: GLACIER_IR
          restore: null

    - id: personal-local
      description: Restic repository on the mounted external disk.
      storage-id: external-disk
      enabled: false
      # Relative directory inside storage.path. Restic creates it during init.
      path: restic/personal
      password: CHANGE_ME
      # cache-dir: .restic-cache/personal-local

# Configured backup jobs. Each repository ID must match an ID above.
backups:
    - job-id: documents
      description: Back up local documents.
      # One job can write independent snapshots to multiple repositories.
      restic-repository-ids:
          - personal-b2
          - personal-local
      # Files and directories used by `generic backup run`; ~ is expanded.
      paths:
          - ~/Documents
      # Optional restic snapshot tag; defaults to the job ID.
      # tag: documents

    - job-id: voice-memos
      description: Back up macOS Voice Memos with the specialized subcommand.
      restic-repository-ids:
          - personal-b2
      # The specialized workflow discovers its own source paths.

    - job-id: example-github-repository
      description: Back up one GitHub repository and its selected GitHub data.
      restic-repository-ids:
          - personal-b2
          - personal-local
      # GitHub jobs use a managed local workspace instead of paths.
      github:
          # github.com SSH and token-free HTTPS clone URLs are supported.
          repository-url: git@github.com:example/example-repository.git
          authentication:
              # Optional for SSH when an existing agent/config already works.
              git:
                  ssh:
                      # Each secret source contains exactly one env or file key.
                      private-key:
                          file: /var/run/secrets/github/ssh-private-key
                      # Strict host verification is always enabled.
                      known-hosts:
                          file: /var/run/secrets/github/known-hosts
              # Required only when metadata or release-assets is enabled.
              api:
                  token:
                      env: GITHUB_MIGRATION_TOKEN
          # All component flags are required. LFS requires git.
          components:
              git: true
              lfs: true
              wiki: true
              metadata: true
              release-assets: true
          # Maximum wait for GitHub to prepare a migration export.
          migration-timeout-seconds: 3600
