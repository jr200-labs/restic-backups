[project]
name = "restic-backups"
version = "0.1.13"
description = "Restic backup CLI with optional SOPS configuration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.66",
    "click>=8.5.1",
    "mlx-whisper>=0.4.3; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "prometheus-client>=0.26.0",
    "pyannote.audio>=4.0.7",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
    "typer>=0.28.0",
]

[project.urls]
Documentation = "https://jr200-labs.github.io/restic-backups/"
Repository = "https://github.com/jr200-labs/restic-backups"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "quarto-cli>=1.11.9",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]

[project.scripts]
restic-backups = "restic_backups.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.13.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.mypy]
packages = ["restic_backups"]

# ponytail: the ML/Click workflow is dynamically typed; remove as it gains annotations.
[[tool.mypy.overrides]]
module = ["restic_backups.voice_memos.*"]
ignore_errors = true

[tool.ruff]
extend = ".shared/ruff.toml"
